[workspace]
# Every crate under crates/ is a member: adding a crate never edits this file.
members = ["crates/*"]
# The cargo-fuzz crate: its own workspace and lockfile on a pinned nightly
# (fuzz/README.md), never part of the stable build, tests or clippy.
exclude = [
    "fuzz",
    # The launcher's end-to-end fixture product: its own workspace and
    # lockfile, built once per CPU target by scripts/launcher-e2e.sh.
    "crates/seaworthy-launcher/e2e",
]
resolver = "3"

# Shared metadata. The crates are versioned in lockstep: a caller pins one
# seaworthy version for every crate it uses.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xangelix/seaworthy"
homepage = "https://github.com/xangelix/seaworthy"

# One version per dependency for the whole family. A crate takes what it
# needs with `name.workspace = true` (adding features locally); a dependency
# not listed here is added here first.
[workspace.dependencies]
seaworthy-crypto = { version = "0.1.0", path = "crates/seaworthy-crypto" }
seaworthy-formats = { version = "0.1.0", path = "crates/seaworthy-formats" }
seaworthy-launcher = { version = "0.1.0", path = "crates/seaworthy-launcher" }
seaworthy-levels = { version = "0.1.0", path = "crates/seaworthy-levels" }
seaworthy-service = { version = "0.1.0", path = "crates/seaworthy-service" }
# The docker test harness: unpublished (`publish = false`), a dev-dependency
# only, so a path without a version (cargo drops it from published manifests).
seaworthy-test-support = { path = "crates/seaworthy-test-support" }
seaworthy-updater = { version = "0.1.0", path = "crates/seaworthy-updater" }

aws-lc-fips-sys = "=0.14.2"
aws-lc-rs = { version = "=1.18.1", default-features = false }
base64 = "0.23"
bollard = { version = "0.21.1", default-features = false }
bytes = "1.12"
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
libc = "0.2.189"
miniz_oxide = "0.8.9"
object = { version = "0.37.3", default-features = false }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.46", default-features = false }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
subtle = "2.6.1"
tempfile = "3.27"
testcontainers = { version = "0.28.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53", default-features = false }
toml = { version = "0.9.12", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
url = "2.5.8"
windows-service = "0.8.1"
windows-sys = "0.61.2"
yaml-rust2 = { version = "0.13", default-features = false }
zeroize = "1.9"
zstd = { version = "0.14", default-features = false }

# The baseline every crate inherits with `[lints] workspace = true`. Stricter
# per-crate rules (for example `clippy::indexing_slicing` and
# `clippy::arithmetic_side_effects` in parsers) go in the crate root as
# `#![deny(...)]`, because a crate cannot both inherit and extend `[lints]`.
# CI runs clippy with `-D warnings`, so "warn" fails the build too.
[workspace.lints.rust]
# Unsafe code only in documented FFI modules, each block allowed locally
# with a `// SAFETY:` comment; crates without FFI `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Library code never panics on input: errors are values.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
