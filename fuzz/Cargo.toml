# seaworthy fuzz targets (cargo-fuzz layout). A STANDALONE workspace with its
# own Cargo.lock, excluded from the root workspace (`exclude = ["fuzz"]`
# there): libfuzzer-sys, arbitrary and the nightly sanitizer builds never
# touch the stable build, `cargo test --workspace`, clippy or cargo-deny's
# graph. Drive it through `scripts/fuzz.sh`; see fuzz/README.md.
#
# The target LOGIC lives in the library (`src/targets/<name>.rs`, one
# `pub fn run(data: &[u8])` each, listed once in `src/lib.rs`), so
# `cargo test --manifest-path fuzz/Cargo.toml` replays every committed seed
# and regression input on STABLE, without libFuzzer (tests/replay.rs). The
# `fuzz_targets/<name>.rs` binaries are one-line libFuzzer wrappers.

[package]
name = "seaworthy-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[lib]
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# The fuzzed crates. `fuzzing` enables a crate's doc-hidden `__fuzz` seam
# over crate-private parsers (no extra dependencies).
seaworthy-levels = { path = "../crates/seaworthy-levels" }
seaworthy-formats = { path = "../crates/seaworthy-formats" }
seaworthy-service = { path = "../crates/seaworthy-service", features = ["fuzzing"] }
seaworthy-updater = { path = "../crates/seaworthy-updater", features = ["fuzzing"] }
# The CLI's parsers and writers: the release version, seaworthy.toml, the
# ELF/PE readers verify runs, the archive writers and the version-resource
# stamper (dist_inputs, dist_archive, dist_pe), and with `publish-s3` the S3
# client's XML parsers, key rules and SigV4 encoding (s3_xml; public API,
# so no seam).
seaworthy = { path = "../crates/seaworthy", default-features = false, features = ["publish-s3"] }
url = "2"
# dist_archive's independent readers: the tarball's zstd and the zip's
# deflate (both already in the CLI's graph).
zstd = { version = "0.14", default-features = false }
miniz_oxide = "0.8"
# dist_pe's check that a stamped image still parses (read side only).
object = { version = "0.37", default-features = false, features = ["read_core", "pe", "std"] }

[[bin]]
name = "dist_archive"
path = "fuzz_targets/dist_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dist_inputs"
path = "fuzz_targets/dist_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dist_pe"
path = "fuzz_targets/dist_pe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "levels_records"
path = "fuzz_targets/levels_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "s3_xml"
path = "fuzz_targets/s3_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "service_unit"
path = "fuzz_targets/service_unit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "updater_manifest"
path = "fuzz_targets/updater_manifest.rs"
test = false
doc = false
bench = false

# The fuzzed crates, as path dependencies. A crate that reaches private
# parsers exposes them behind its own `fuzzing` feature (off by default, no
# extra dependencies); enable it here, e.g.:
#
#   seaworthy-levels = { path = "../crates/seaworthy-levels" }
#   seaworthy-updater = { path = "../crates/seaworthy-updater", features = ["fuzzing"] }

[profile.release]
debug = 1

# One [[bin]] per target, in sync with the `targets!` list in src/lib.rs
# (tests/replay.rs fails when they disagree). Each entry is exactly:
#
#   [[bin]]
#   name = "<target>"
#   path = "fuzz_targets/<target>.rs"
#   test = false
#   doc = false
#   bench = false
