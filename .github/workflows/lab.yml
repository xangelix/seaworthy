# The lab: the contract between what the seaworthy CLI packages and what
# the launcher and the update helper do with it, end to end, on GitHub-
# hosted Linux and macOS runners (docs/testing.md): the launcher e2e
# (qemu CPU models, the FIPS module, the macOS bundle, disk image and pkg),
# the Linux conformance suite (real packages under systemd on five
# distributions), the macOS pkg install, and the upgrade-from-previous
# lanes. The Windows lanes are in lab-windows.yml.
#
# The upgrade lanes install the previous build (the latest successful run
# of this workflow on main, fetched with the job's read-only token and
# checked against the digest GitHub recorded) and update it to this run's.
# Runs on main keep their candidate as the next run's previous build; the
# weekly schedule keeps one fresh. A run with nothing to update from (the
# first) skips the lane with a warning. Make "Lab result" the required check.
name: Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the moving distribution mirrors and runner images, and a
    # recent previous build for the upgrade lanes.
    - cron: "37 5 * * 2"

permissions: {}

concurrency:
  group: lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

defaults:
  run:
    shell: bash

jobs:
  launcher-linux:
    name: Launcher e2e (Linux, qemu CPU models)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-lab-launcher
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: qemu-user (pinned, SHA-256 verified)
        run: echo "QEMU_X86_64=$(scripts/ci-qemu.sh)" >> "$GITHUB_ENV"
      - name: scripts/launcher-e2e.sh selection
        env:
          SEAWORTHY_LAUNCHER_E2E_REQUIRED: "1"
          # The Windows lanes check the PE records natively.
          SEAWORTHY_LAUNCHER_E2E_WINDOWS: "0"
        run: scripts/launcher-e2e.sh selection 2>&1 | tee launcher-e2e.log
      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-launcher-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: launcher-e2e.log
          if-no-files-found: ignore
          retention-days: 14

  launcher-linux-fips:
    name: Launcher e2e (Linux, FIPS)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The AWS-LC FIPS module builds from source with CMake, Go, Perl and
      # Clang, all preinstalled on GitHub's Ubuntu image.
      CC: clang
      CXX: clang++
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-lab-fips
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: scripts/launcher-e2e.sh fips
        env:
          SEAWORTHY_LAUNCHER_E2E_REQUIRED: "1"
        run: scripts/launcher-e2e.sh fips 2>&1 | tee launcher-e2e-fips.log
      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-launcher-fips-${{ github.run_id }}-${{ github.run_attempt }}
          path: launcher-e2e-fips.log
          if-no-files-found: ignore
          retention-days: 14

  launcher-macos:
    name: Launcher e2e (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-lab-launcher-macos
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: bash 4.4+ (macOS ships 3.2)
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: scripts/launcher-e2e-macos.sh
        env:
          SEAWORTHY_LAUNCHER_E2E_REQUIRED: "1"
        run: bash scripts/launcher-e2e-macos.sh 2>&1 | tee launcher-e2e-macos.log
      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-launcher-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: launcher-e2e-macos.log
          if-no-files-found: ignore
          retention-days: 14

  linux-conformance:
    name: Linux conformance (5 distributions)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # The job's own docker daemon must be usable.
      SEAWORTHY_TEST_CONTAINERS_REQUIRED: "1"
    steps:
      # sudo (the packaging tools) and containers (the builder, the systemd
      # hosts: never privileged, CAP_SYS_ADMIN only) stay enabled here.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-lab-conformance
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Packaging and repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            rpm createrepo-c dpkg-dev pacman-package-manager libarchive-tools gnupg desktop-file-utils
      - name: Pull the digest-pinned images
        run: scripts/pull-test-images.sh --only debian-13,ubuntu-24.04,ubi-9,fedora-43,arch,rust-builder
      - name: scripts/linux-conformance.sh
        run: scripts/linux-conformance.sh all 2>&1 | tee linux-conformance.log
      - name: Upload the log and the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            linux-conformance.log
            target/linux-conformance/lane.json
            target/linux-conformance/report/
          if-no-files-found: ignore
          retention-days: 14

  macos-pkg-install:
    name: macOS pkg install
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-lab-pkg-install
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: bash 4.4+ (macOS ships 3.2)
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      # The runner is a throwaway VM with passwordless sudo: the lane
      # installs system daemons.
      - name: scripts/macos-pkg-install.sh
        env:
          SEAWORTHY_MACOS_INSTALL_REQUIRED: "1"
        run: bash scripts/macos-pkg-install.sh 2>&1 | tee macos-pkg-install.log
      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-pkg-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: macos-pkg-install.log
          if-no-files-found: ignore
          retention-days: 14

  upgrade-linux:
    name: Upgrade from previous (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # the previous build: an artifact of an earlier run of this workflow
    env:
      SEAWORTHY_TEST_CONTAINERS_REQUIRED: "1"
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-lab-upgrade
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Pull the digest-pinned images
        run: scripts/pull-test-images.sh --only debian-13,ubuntu-24.04,ubi-9,fedora-43,arch,rust-builder
      # Its helper trusts the fixture's CI test key as a CI build does: the
      # script builds the plan, and only the plan, with seaworthy-formats'
      # switch (SEAWORTHY_ALLOW_CI_TEST_KEYS=1: a lab build, never a
      # release), checks the helper carries the CI test-key marker, and
      # packages with --ci-test-signing.
      - name: The candidate (this run's build)
        env:
          SEAWORTHY_UPGRADE_SEQUENCE: ${{ github.run_number }}
        run: scripts/upgrade-candidate.sh linux target/lab-upgrade/candidate
      - name: Keep the candidate as the next run's previous build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-upgrade-linux
          path: target/lab-upgrade/candidate/
          if-no-files-found: error
          retention-days: 30
      - name: The previous build (the latest successful run on main)
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          scripts/upgrade-previous.sh lab-upgrade-linux target/lab-upgrade/previous || status=$?
          case "$status" in
            0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Linux upgrade lane skipped::no previous build to update from (see the step above); this run's candidate becomes the next one's previous build"
              echo "Linux upgrade lane skipped: no previous build to update from." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac
      - name: scripts/upgrade-linux.sh
        if: steps.previous.outputs.found == 'true'
        run: scripts/upgrade-linux.sh target/lab-upgrade/previous target/lab-upgrade/candidate target/lab-upgrade/report 2>&1 | tee upgrade-linux.log
      - name: Upload the log and the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-upgrade-linux-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            upgrade-linux.log
            target/lab-upgrade/report/
            target/lab-upgrade/previous/previous-run.json
          if-no-files-found: ignore
          retention-days: 14

  upgrade-macos:
    name: Upgrade from previous (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # the previous build: an artifact of an earlier run of this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-lab-upgrade-macos
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: bash 4.4+ (macOS ships 3.2)
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      # As on Linux: the plan alone built with the CI test-key switch.
      - name: The candidate (this run's build)
        env:
          SEAWORTHY_UPGRADE_SEQUENCE: ${{ github.run_number }}
        run: bash scripts/upgrade-candidate.sh macos target/lab-upgrade/candidate
      - name: Keep the candidate as the next run's previous build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-upgrade-macos
          path: target/lab-upgrade/candidate/
          if-no-files-found: error
          retention-days: 30
      - name: The previous build (the latest successful run on main)
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          bash scripts/upgrade-previous.sh lab-upgrade-macos target/lab-upgrade/previous || status=$?
          case "$status" in
            0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=macOS upgrade lane skipped::no previous build to update from (see the step above); this run's candidate becomes the next one's previous build"
              echo "macOS upgrade lane skipped: no previous build to update from." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac
      # The runner is a throwaway VM with passwordless sudo: the lane
      # installs system daemons, edits /etc/hosts and the System keychain,
      # and restores them.
      - name: scripts/upgrade-macos.sh
        if: steps.previous.outputs.found == 'true'
        env:
          SEAWORTHY_UPGRADE_REQUIRED: "1"
        run: bash scripts/upgrade-macos.sh target/lab-upgrade/previous target/lab-upgrade/candidate 2>&1 | tee upgrade-macos.log
      - name: Upload the log and the evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-upgrade-macos-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            upgrade-macos.log
            target/lab-upgrade-macos/evidence/
            target/lab-upgrade/previous/previous-run.json
          if-no-files-found: ignore
          retention-days: 14

  result:
    name: Lab result
    if: always()
    needs:
      - launcher-linux
      - launcher-linux-fips
      - launcher-macos
      - linux-conformance
      - macos-pkg-install
      - upgrade-linux
      - upgrade-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      # Every lab job must succeed (an upgrade lane with nothing to update
      # from succeeds, with a warning).
      - name: Every lab job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'to_entries | all(.value.result == "success")' <<<"$NEEDS" >/dev/null \
            || { echo "::error::a lab job failed, was cancelled, or was skipped"; exit 1; }
