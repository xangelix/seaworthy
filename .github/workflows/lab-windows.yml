# The Windows lab: the packaging-to-runtime contract end to end on GitHub-hosted
# `windows-2025` runners (an administrator, a real Service Control Manager, real NTFS
# DACLs, Windows Installer). The build job builds the fixture products and their MSIs
# with the seaworthy CLI (scripts/windows-lab-build.ps1); each lane installs them on a
# fresh runner. docs/testing-windows.md describes every lane.
#
# The upgrade lane installs the previous build (the build job's upgrade candidate from the
# latest successful run of this workflow on main, fetched with the job's read-only token
# and checked against the digest GitHub recorded) and updates it to this run's. Runs on
# main keep their candidate as the next run's previous build; the weekly schedule keeps
# one fresh. A run with nothing to update from (the first) skips the lane with a warning.
#
# Make "Windows lab result" the required check: it fails unless the build and every
# lane passed. The FIPS lane runs on the schedule and on demand only, and its result is
# informational (GitHub's runners are Hyper-V guests, where the FIPS module's CPU-jitter
# entropy can abort a process on its first random draw).
name: Windows lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, against the moving runner image.
    - cron: "41 5 * * 2"

permissions: {}

concurrency:
  group: lab-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build the fixture and its MSIs
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # The upgrade candidate's plan alone is built with seaworthy-formats' CI
      # test-key switch (SEAWORTHY_ALLOW_CI_TEST_KEYS=1, set by the script for
      # that build: a dev build, never a release), so its helper trusts the
      # fixture's CI test key through ci_test_keys!; the script checks the
      # helper carries the CI test-key marker.
      - name: Build, package and bundle
        env:
          # The upgrade candidate's release sequence: a later run is a newer release.
          SEAWORTHY_UPGRADE_SEQUENCE: ${{ github.run_number }}
        run: |
          pwsh -NoProfile -File scripts/windows-lab-build.ps1 -Out (Join-Path $env:RUNNER_TEMP 'windows-lab')
          if ($LASTEXITCODE -ne 0) { throw "windows-lab-build.ps1 exited $LASTEXITCODE" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lab-bundle
          path: ${{ runner.temp }}/windows-lab/bundle/
          if-no-files-found: error
          retention-days: 3
      - name: Keep the upgrade candidate as the next run's previous build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-upgrade-windows
          path: ${{ runner.temp }}/windows-lab/upgrade-candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Upload the build's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lab-build-logs
          path: |
            ${{ runner.temp }}/windows-lab/logs/
            ${{ runner.temp }}/windows-lab/releases/*/*/packages/*.wxs
          if-no-files-found: ignore
          retention-days: 7
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure
        with:
          paths: |
            ${{ runner.temp }}/windows-lab/logs

  install:
    name: MSI install, upgrade and removal
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-lab-bundle
          path: ${{ runner.temp }}/bundle
      - name: The desktop fixture's MSI
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'lab-install'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-msi-install.ps1 `
            -Bundle (Join-Path $env:RUNNER_TEMP 'bundle') `
            -JUnitDir (Join-Path $out 'junit') -EvidenceDir (Join-Path $out 'evidence')
          if ($LASTEXITCODE -ne 0) { throw "windows-msi-install.ps1 exited $LASTEXITCODE" }
      - name: Upload the lane's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lab-install-logs
          path: ${{ runner.temp }}/lab-install/
          if-no-files-found: ignore
          retention-days: 7
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure
        with:
          paths: |
            ${{ runner.temp }}/lab-install

  update:
    name: Service update, rollback and squatting
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-lab-bundle
          path: ${{ runner.temp }}/bundle
      - name: The update lane
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'lab-update'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-msi-update.ps1 `
            -Bundle (Join-Path $env:RUNNER_TEMP 'bundle') `
            -JUnitDir (Join-Path $out 'junit') -EvidenceDir (Join-Path $out 'evidence')
          if ($LASTEXITCODE -ne 0) { throw "windows-msi-update.ps1 exited $LASTEXITCODE" }
      - name: Upload the lane's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lab-update-logs
          path: ${{ runner.temp }}/lab-update/
          if-no-files-found: ignore
          retention-days: 7
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure
        with:
          paths: |
            ${{ runner.temp }}/lab-update

  scm:
    name: SCM end to end
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-lab-bundle
          path: ${{ runner.temp }}/bundle
      # A native crash leaves nothing in the log: Windows Error Reporting writes a
      # minidump per crashed process (failure.crash_is_restarted aborts the service on
      # purpose: one expected dump).
      - name: Crash dumps
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'lab-scm\crashdumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $wer -Force | Out-Null
          Set-ItemProperty -Path $wer -Name DumpFolder -Value $dumps -Type ExpandString
          Set-ItemProperty -Path $wer -Name DumpType -Value 1 -Type DWord
          Set-ItemProperty -Path $wer -Name DumpCount -Value 20 -Type DWord
          Start-Service WerSvc -ErrorAction SilentlyContinue
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SEAWORTHY_CRASHDUMP_DIR=$dumps`n")
      - name: The SCM suite
        shell: powershell
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle'
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundle 'scm\packages') -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { throw "expected one SCM fixture MSI, found $($msi.Count)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-scm-e2e.ps1 -Phase Service `
            -BinDir (Join-Path $bundle 'bin') -Msi $msi[0].FullName -ExpectFips 0 `
            -RustScmTestExe (Join-Path $bundle 'bin\windows_scm-test.exe') `
            -JUnitDir (Join-Path $env:RUNNER_TEMP 'lab-scm\junit')
          if ($LASTEXITCODE -ne 0) { throw "windows-scm-e2e.ps1 exited $LASTEXITCODE" }
      # Informational: fresh processes' first random draw on a Hyper-V guest
      # (docs/testing-windows.md). Its result is data, never this job's.
      - name: Entropy probe (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: powershell
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-scm-e2e.ps1 -Phase Entropy `
            -BinDir (Join-Path $bundle 'bin') -ExpectFips 0 `
            -JUnitDir (Join-Path $env:RUNNER_TEMP 'lab-entropy\junit')
          $code = $LASTEXITCODE
          $verdict = 'no first draw aborted'
          if ($code -ne 0) { $verdict = 'some first draws aborted, or the probe failed (see the log)' }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Entropy probe (informational, non-FIPS): $verdict`n")
          exit $code
      - name: Upload the entropy probe's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lab-entropy
          path: ${{ runner.temp }}/lab-entropy/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the lane's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lab-scm-logs
          path: ${{ runner.temp }}/lab-scm/
          if-no-files-found: ignore
          retention-days: 7
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure
        with:
          paths: |
            ${{ runner.temp }}/lab-scm

  upgrade:
    name: Upgrade from previous
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the previous build: an artifact of an earlier run of this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-lab-bundle
          path: ${{ runner.temp }}/bundle
      # The selection rules, the artifact checks and the lane's parsers on canned data, in
      # the Windows PowerShell that runs them for real next.
      - name: The lane's self-tests
        shell: powershell
        run: |
          foreach ($script in @('windows-upgrade-previous.ps1', 'windows-upgrade.ps1')) {
            powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\$script" -Phase SelfTest
            if ($LASTEXITCODE -ne 0) { throw "$script -Phase SelfTest exited $LASTEXITCODE" }
          }
      - name: The previous build (the latest successful run on main)
        id: previous
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-upgrade-previous.ps1 `
            -Name lab-upgrade-windows -Out (Join-Path $env:RUNNER_TEMP 'lab-upgrade\previous')
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "found=true`n")
          } elseif ($code -eq 3) {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "found=false`n")
            Write-Output "::warning title=Windows upgrade lane skipped::no previous build to update from (see the step above); this run's candidate becomes the next one's previous build"
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Windows upgrade lane skipped: no previous build to update from.`n")
          } else {
            throw "windows-upgrade-previous.ps1 exited $code"
          }
      # The runner is a throwaway VM, the job an administrator: the lane trusts a CA in
      # LocalMachine\Root, edits the hosts file, writes HKLM and installs a service, and
      # undoes all of it in a finally block.
      - name: The upgrade lane
        if: steps.previous.outputs.found == 'true'
        shell: powershell
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle'
          $out = Join-Path $env:RUNNER_TEMP 'lab-upgrade'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-upgrade.ps1 `
            -Previous (Join-Path $out 'previous') -Candidate (Join-Path $bundle 'upgrade') `
            -LabExe (Join-Path $bundle 'bin\seaworthy-lab.exe') -WorkDir (Join-Path $out 'lab') `
            -JUnitDir (Join-Path $out 'junit') -EvidenceDir (Join-Path $out 'evidence')
          if ($LASTEXITCODE -ne 0) { throw "windows-upgrade.ps1 exited $LASTEXITCODE" }
      # Whatever a run killed before its finally block left behind: the lab server, the CA,
      # the hosts entries, the policy key, the product.
      - name: Clean up the machine
        if: always()
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'lab-upgrade'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-upgrade.ps1 -Phase Cleanup `
            -WorkDir (Join-Path $out 'lab') -JUnitDir (Join-Path $out 'junit') -EvidenceDir (Join-Path $out 'evidence')
          if ($LASTEXITCODE -ne 0) { throw "windows-upgrade.ps1 -Phase Cleanup exited $LASTEXITCODE" }
      - name: Upload the lane's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lab-upgrade-logs
          path: |
            ${{ runner.temp }}/lab-upgrade/junit/
            ${{ runner.temp }}/lab-upgrade/evidence/
            ${{ runner.temp }}/lab-upgrade/previous/previous-run.json
          if-no-files-found: ignore
          retention-days: 7
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure
        with:
          paths: |
            ${{ runner.temp }}/lab-upgrade/evidence

  policy-live:
    name: Update policy against the live registry
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-lab-bundle
          path: ${{ runner.temp }}/bundle
      # crates/seaworthy-updater/tests/windows_policy_live.rs: writes HKLM, so it runs
      # only with SEAWORTHY_WINDOWS_LIVE_REGISTRY=1 (it says it skipped otherwise, which
      # must never pass here).
      - name: windows_policy_live
        env:
          SEAWORTHY_WINDOWS_LIVE_REGISTRY: "1"
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'bundle\bin\windows_policy_live-test.exe'
          $log = Join-Path $env:RUNNER_TEMP 'policy-live.log'
          # The test's stderr is part of the evidence: not an error record under 'Stop'.
          $ErrorActionPreference = 'Continue'
          & $exe --test-threads 1 --nocapture 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -ne 0) { throw "windows_policy_live exited $code" }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -match 'SKIPPED') { throw 'windows_policy_live skipped: SEAWORTHY_WINDOWS_LIVE_REGISTRY did not reach it' }
          if ($text -notmatch 'test result: ok\. 1 passed') { throw 'windows_policy_live did not run its one test' }

  fips:
    name: FIPS (informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Crash dumps
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'lab-fips\crashdumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $wer -Force | Out-Null
          Set-ItemProperty -Path $wer -Name DumpFolder -Value $dumps -Type ExpandString
          Set-ItemProperty -Path $wer -Name DumpType -Value 1 -Type DWord
          Set-ItemProperty -Path $wer -Name DumpCount -Value 20 -Type DWord
          Start-Service WerSvc -ErrorAction SilentlyContinue
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SEAWORTHY_CRASHDUMP_DIR=$dumps`n")
      # The fixture's cores on the AWS-LC FIPS module (the module's DLL beside them), its
      # MSI, and the lanes' binaries built FIPS.
      - name: Build, package and bundle (FIPS)
        id: build
        continue-on-error: true
        run: |
          pwsh -NoProfile -File scripts/windows-lab-build.ps1 -Fips -Out (Join-Path $env:RUNNER_TEMP 'windows-lab-fips')
          if ($LASTEXITCODE -ne 0) { throw "windows-lab-build.ps1 -Fips exited $LASTEXITCODE" }
      - name: The SCM suite on the FIPS MSI
        id: suite
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'windows-lab-fips\bundle'
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundle 'scm\packages') -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { throw "expected one SCM fixture MSI, found $($msi.Count)" }
          $bin = Join-Path $bundle 'bin'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-scm-e2e.ps1 -Phase All `
            -BinDir $bin -Msi $msi[0].FullName -ExpectFips 1 -FipsDllDir $bin `
            -RustScmTestExe (Join-Path $bin 'windows_scm-test.exe') `
            -JUnitDir (Join-Path $env:RUNNER_TEMP 'lab-fips\junit')
          if ($LASTEXITCODE -ne 0) { throw "windows-scm-e2e.ps1 exited $LASTEXITCODE" }
      - name: Report
        id: report
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          SUITE: ${{ steps.suite.outcome }}
        run: |
          $result = 'failure'
          if ($env:BUILD -eq 'success' -and $env:SUITE -eq 'success') { $result = 'success' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "result=$result`n")
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "FIPS lab (informational): build $env:BUILD, SCM suite $env:SUITE`n")
      - name: Upload the lane's logs
        if: steps.build.outcome == 'failure' || steps.suite.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lab-fips-logs
          path: |
            ${{ runner.temp }}/lab-fips/
            ${{ runner.temp }}/windows-lab-fips/logs/
          if-no-files-found: ignore
          retention-days: 7
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure
        with:
          paths: |
            ${{ runner.temp }}/lab-fips
            ${{ runner.temp }}/windows-lab-fips/logs

  result:
    name: Windows lab result
    if: always()
    needs: [build, install, update, upgrade, scm, policy-live, fips]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      # The build and every lane must succeed (the upgrade lane with nothing to update from
      # succeeds, with a warning); the FIPS lane is reported, never required.
      - name: Every required lane passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          fips="$(jq -r 'if .fips.result == "skipped" then "not run (schedule and workflow_dispatch only)"
            else (.fips.outputs.result // .fips.result) end' <<<"$NEEDS")"
          echo "FIPS (informational): $fips" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -en --argjson needs "$NEEDS" '["build", "install", "update", "upgrade", "scm", "policy-live"]
            | all(.[]; $needs[.].result == "success")' >/dev/null \
            || { echo "::error::the Windows lab's build or a required lane failed, was cancelled, or was skipped"; exit 1; }
