# Release of the `seaworthy` CLI (docs/releasing.md): on a `v*` tag, build
# the binary for every supported platform from a clean checkout (no caches),
# package deterministic archives with SHA256SUMS, attest their build
# provenance (Sigstore-signed, verifiable with `gh attestation verify`), and
# create a DRAFT GitHub release that a maintainer reviews and publishes.
#
# A manual run (workflow_dispatch) is a dry run: it builds and packages, and
# attests and releases nothing. While crates/seaworthy does not exist, every
# run stops after the plan. Nothing is published to crates.io from here.
#
# Linux binaries are static musl builds: one binary runs on every
# distribution, old or new, glibc or not (docs/releasing.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cli: ${{ steps.plan.outputs.cli }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: a release tag must point at a commit on main.
          fetch-depth: 0
      - name: Check the tag and the workspace
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/ci/plan.sh | tee plan.txt
          version="$(sed -n 's/^version=//p' plan.txt)"
          cli="$(sed -n 's/^cli=//p' plan.txt)"
          if [ "$cli" != true ]; then
            echo "::notice::crates/seaworthy does not exist yet: nothing to release"
            echo "cli=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = push ]; then
            if [ "$REF_TYPE" != tag ] || [ "$TAG" != "v$version" ]; then
              echo "::error::tag '$TAG' does not match the workspace version (expected v$version)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag '$TAG' points at $GITHUB_SHA, which is not on main"
              exit 1
            fi
          fi
          { echo "cli=true"; echo "version=$version"; } >>"$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.cli == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            # No dependency on the Visual C++ runtime DLLs.
            rustflags: -C target-feature=+crt-static
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # sudo stays available here: the musl C toolchain comes from apt.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: cargo build --release
        env:
          TARGET: ${{ matrix.target }}
          TARGET_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # C code in dependencies (AWS-LC) must build against musl too.
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          # No build machine path in the binary: the panic locations of
          # registry crates and the build directory name /cargo and
          # /seaworthy, and the standard library's stay /rustc/<commit> even
          # where rust-src is installed (rustc otherwise points them at the
          # local copy), so the bytes don't depend on where the runner keeps
          # them. AWS-LC's build maps its own C sources' paths. Passed
          # unsplit (CARGO_ENCODED_RUSTFLAGS), so a path with a space stays
          # one flag.
          sysroot="$(rustc --print sysroot)"
          commit="$(rustc -vV | sed -n 's/^commit-hash: //p')"
          flags=()
          [ -z "$TARGET_RUSTFLAGS" ] || read -r -a flags <<<"$TARGET_RUSTFLAGS"
          flags+=("--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
            "--remap-path-prefix=$GITHUB_WORKSPACE=/seaworthy"
            "--remap-path-prefix=$sysroot/lib/rustlib/src/rust=/rustc/$commit")
          CARGO_ENCODED_RUSTFLAGS="$(IFS=$'\x1f'; printf '%s' "${flags[*]}")"
          export CARGO_ENCODED_RUSTFLAGS
          cargo build --release --locked --package seaworthy --target "$TARGET"
      - name: Stage the binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe=seaworthy
          if [ "$RUNNER_OS" = Windows ]; then exe=seaworthy.exe; fi
          # The remapping above held: no path of this machine in the bytes.
          for path in "$GITHUB_WORKSPACE" "${CARGO_HOME:-$HOME/.cargo}" "$HOME" "${USERPROFILE:-$HOME}"; do
            if grep -a -q -F -- "$path" "target/$TARGET/release/$exe"; then
              echo "::error::the $TARGET binary holds the build machine's path $path"
              exit 1
            fi
          done
          mkdir -p "staging/bin-$TARGET"
          cp "target/$TARGET/release/$exe" "staging/bin-$TARGET/$exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: staging/bin-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins
      - name: Archives and SHA256SUMS
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/ci/package-release.sh "$VERSION" bins dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest build provenance
    needs: [plan, package]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Protect this environment (required reviewers, `v*` tags only) to gate
    # the release; see docs/releasing.md.
    environment: release
    permissions:
      id-token: write # a Sigstore signing certificate for this workflow run (OIDC)
      attestations: write # store the attestations in the repository
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: Draft the GitHub release
    needs: [plan, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; delete it to rebuild"
            exit 1
          fi
          {
            echo "Draft: review, edit the notes, then publish."
            echo
            echo "## Verifying the downloads"
            echo
            echo '```sh'
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo "gh attestation verify <archive> \\"
            echo "  --repo $REPO \\"
            echo "  --signer-workflow $REPO/.github/workflows/release.yml \\"
            echo "  --source-ref refs/tags/$TAG \\"
            echo "  --deny-self-hosted-runners"
            echo '```'
          } >notes.md
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --title "seaworthy $TAG" --notes-file notes.md dist/*
