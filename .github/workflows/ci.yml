# Continuous integration: formatting, clippy and tests on Linux, Windows and
# macOS, the MSRV, docs, cargo-deny, the FIPS build, the fuzz-corpus replay,
# the repository's check scripts, and a lint of the workflows themselves.
#
# The jobs run over whatever crates/ holds. Cargo refuses a workspace with no
# members, so the jobs that need one wait for `plan` (scripts/ci/plan.sh) and
# are skipped while crates/ is empty. Make "CI result" the required check: it
# fails unless every job passed or was skipped by the plan.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly, against the moving advisory database and runner images.
    - cron: "23 4 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  plan:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
      features: ${{ steps.plan.outputs.features }}
      fips: ${{ steps.plan.outputs.fips }}
      msrv: ${{ steps.plan.outputs.msrv }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Describe the workspace
        id: plan
        run: scripts/ci/plan.sh | tee -a "$GITHUB_OUTPUT"
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  fmt:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Format
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: cargo fmt (workspace)
        if: needs.plan.outputs.crates == 'true'
        run: cargo fmt --all --check
      - name: cargo fmt (fuzz)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  clippy:
    defaults:
      run:
        # Plain bash on every leg (Git Bash on Windows); the cargo step tees its
        # output for the failure annotations itself.
        shell: bash
    name: Clippy (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Every feature except the FIPS ones (the `fips` job covers those).
      FEATURES: ${{ needs.plan.outputs.features }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings 2>&1 | tee -a "$RUNNER_TEMP/step-output.log"
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  test:
    defaults:
      run:
        # Plain bash on every leg (Git Bash on Windows); the cargo step tees its
        # output for the failure annotations itself.
        shell: bash
    name: Test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FEATURES: ${{ needs.plan.outputs.features }}
      # The container suites run in the `containers` job; here docker is
      # disabled (Linux) or absent, so they skip instead of failing.
      SEAWORTHY_TEST_CONTAINERS_REQUIRED: "0"
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # ci_template runs the GitLab template's seaworthy.sh, which needs bash
      # 4.4 or later (as dist.yml's macOS jobs install it); macOS ships 3.2.
      - name: Bash 4.4 or later (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: cargo test
        run: cargo test --workspace --locked --features "$FEATURES" 2>&1 | tee -a "$RUNNER_TEMP/step-output.log"

  # seaworthy-formats built with its CI test-key switch on: the trust paths
  # only such a build has (the marker, ci_test_keys!, test keys accepted).
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure
  ci-test-keys:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Test (CI test-key switch)
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: cargo test -p seaworthy-formats (SEAWORTHY_ALLOW_CI_TEST_KEYS=1)
        env:
          SEAWORTHY_ALLOW_CI_TEST_KEYS: "1"
        run: cargo test -p seaworthy-formats --locked
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  containers:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Container suites (Linux)
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FEATURES: ${{ needs.plan.outputs.features }}
      # Docker must be usable here: a missing or broken daemon fails the
      # suites instead of skipping them.
      SEAWORTHY_TEST_CONTAINERS_REQUIRED: "1"
    steps:
      # Containers stay enabled in this job (the suites start public,
      # digest-pinned images; never privileged); sudo is not needed.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Pre-pull the test images
        run: scripts/pull-test-images.sh
      - name: cargo test (container suites required)
        run: cargo test --workspace --locked --features "$FEATURES"
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  packaging:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Packaging tools (Arch Linux)
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      # Every packaging test runs: a missing tool fails instead of skipping.
      SEAWORTHY_REQUIRE_PACKAGE_TOOLS: "1"
      # The container suites run in the `containers` job.
      SEAWORTHY_TEST_CONTAINERS_REQUIRED: "0"
      # pwsh for the Windows scripts' tests: Microsoft's release tarball,
      # pinned by the SHA-256 the release publishes (hashes.sha256).
      PWSH_VERSION: "7.6.7"
      PWSH_SHA256: 6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431
      CONTAINER: seaworthy-packaging
    # The tests run in the digest-pinned Arch Linux image the conformance
    # lane uses (seaworthy-test-support's ARCH pin): pacman's repo-add and
    # pacman-conf exist only there, the GitLab template's tools image is
    # typically Arch, and Arch packages every other tool from its signed
    # repositories. Not a job container: harden-runner can't monitor one,
    # so the image runs as an unprivileged container on the monitored VM,
    # and the tests run in it as the runner's own uid.
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the pinned Arch Linux container
        run: |
          image="$(sed -n 's/^pub const ARCH: &str = "\(.*\)";$/\1/p' crates/seaworthy-test-support/src/images.rs)"
          if ! [[ "$image" =~ ^archlinux:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest-pinned ARCH image in crates/seaworthy-test-support/src/images.rs"
            exit 1
          fi
          docker pull --quiet "$image"
          docker run --detach --name "$CONTAINER" --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work "$image" sleep infinity
      - name: Install the packaging tools
        run: |
          docker exec --interactive --env PWSH_VERSION --env PWSH_SHA256 \
            --env BUILDER_UID="$(id -u)" --env BUILDER_GID="$(id -g)" \
            "$CONTAINER" bash -euo pipefail -s <<'SCRIPT'
          # Arch's signed repositories (pacman verifies every package).
          pacman -Syu --noconfirm --needed --noprogressbar base-devel git rustup cmake openssl \
            zlib dpkg rpm-tools createrepo_c pacman gnupg libarchive msitools \
            desktop-file-utils unzip zstd llvm libxml2 icu dash jq >/dev/null
          # pwsh: https only, bounded, the pinned SHA-256 checked before extracting.
          mkdir -p /tmp/pwsh /opt/pwsh
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --connect-timeout 30 --max-time 600 --max-filesize $((256 * 1024 * 1024)) \
            -o /tmp/pwsh/pwsh.tar.gz \
            "https://github.com/PowerShell/PowerShell/releases/download/v$PWSH_VERSION/powershell-$PWSH_VERSION-linux-x64.tar.gz"
          echo "$PWSH_SHA256  /tmp/pwsh/pwsh.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/pwsh/pwsh.tar.gz -C /opt/pwsh
          chmod 0755 /opt/pwsh/pwsh
          ln -s /opt/pwsh/pwsh /usr/local/bin/pwsh
          rm -rf /tmp/pwsh
          # The tests run as the runner's uid, which owns the checkout.
          getent group "$BUILDER_GID" >/dev/null || groupadd --gid "$BUILDER_GID" builder
          useradd --uid "$BUILDER_UID" --gid "$BUILDER_GID" --create-home builder
          SCRIPT
      - name: cargo test (seaworthy, seaworthy-updater), every packaging tool required
        run: |
          docker exec --interactive --user builder --env HOME=/home/builder \
            --env CARGO_TERM_COLOR --env CARGO_INCREMENTAL --env CARGO_NET_RETRY \
            --env RUSTUP_MAX_RETRIES --env RUST_BACKTRACE --env SEAWORTHY_REQUIRE_PACKAGE_TOOLS \
            --env SEAWORTHY_TEST_CONTAINERS_REQUIRED "$CONTAINER" bash -euo pipefail -s <<'SCRIPT'
          # rust-toolchain.toml's pinned toolchain.
          rustup set profile minimal
          rustup toolchain install
          # nFPM at its pin (a checksummed release), osslsigncode built from a
          # checksummed source archive, shellcheck from a checksummed release.
          NFPM="$(scripts/ci/install-nfpm.sh)"
          osslsigncode="$(scripts/ci/install-osslsigncode.sh)"
          scripts/ci/install-tool.sh shellcheck
          PATH="$(dirname "$osslsigncode"):$PWD/target/tools:$PATH"
          export NFPM PATH
          for tool in nfpm osslsigncode dpkg-deb dpkg-scanpackages rpm rpmbuild rpmkeys rpmsign \
            createrepo_c repo-add pacman-conf gpg bsdtar wixl msiinfo msiextract \
            desktop-file-validate pwsh shellcheck llvm-rc llvm-readobj dash; do
            [ "$tool" = nfpm ] && tool="$NFPM"
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing"; exit 1; }
          done
          cargo test --locked -p seaworthy -p seaworthy-updater \
            --features seaworthy-updater/helper,seaworthy-updater/relaunch
          SCRIPT
      - name: Remove the container
        if: always()
        run: docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  msrv:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: MSRV (${{ needs.plan.outputs.msrv }})
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FEATURES: ${{ needs.plan.outputs.features }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # workspace.package.rust-version, as x.y.0 when it names no patch.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.plan.outputs.msrv }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Libraries and binaries: what a dependent builds. Dev-dependencies may
      # need a newer toolchain than the MSRV.
      - name: cargo check
        run: cargo check --workspace --lib --bins --locked --features "$FEATURES"
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  docs:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Docs
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FEATURES: ${{ needs.plan.outputs.features }}
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked --features "$FEATURES"
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  deny:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: cargo-deny
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-deny (pinned, SHA-256 verified)
        run: scripts/ci/install-tool.sh cargo-deny
      - name: cargo deny (workspace)
        if: needs.plan.outputs.crates == 'true'
        run: cargo deny --locked check
      # The fuzz crate is never distributed: its licenses are not checked,
      # but advisories, bans and sources are.
      - name: cargo deny (fuzz)
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml --config deny.toml check advisories bans sources
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  fips:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: FIPS (all features, Linux)
    needs: plan
    if: needs.plan.outputs.fips == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      # The container suites (the conformance suite among them, which
      # --all-features compiles) run in the containers and lab jobs; docker
      # is disabled here, so they skip instead of failing.
      SEAWORTHY_TEST_CONTAINERS_REQUIRED: "0"
      # The AWS-LC FIPS module builds from source with CMake, Go, Perl and
      # Clang, all preinstalled on GitHub's Ubuntu image.
      CC: clang
      CXX: clang++
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build tools
        run: |
          clang --version | head -n1
          cmake --version | head -n1
          go version
          perl -e 'print "perl $^V\n"'
      - name: cargo clippy --all-features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test --all-features
        run: cargo test --workspace --all-features --locked
      - name: A FIPS release binary links only the pinned module
        env:
          # The symbol check needs a symbol table (docs/fips.md).
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: |
          scripts/verify-fips-binary.sh --self-test
          cargo build --release --locked -p seaworthy-crypto --features fips --example fips_selfcheck
          scripts/verify-fips-binary.sh target/release/examples/fips_selfcheck
          target/release/examples/fips_selfcheck --expect-fips
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  fuzz-replay:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Fuzz corpus replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The root rust-toolchain.toml (stable): the replay needs no nightly.
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          workspaces: fuzz -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: cargo clippy (fuzz)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Replay every seed and regression
        run: cargo test --manifest-path fuzz/Cargo.toml --locked
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  checks:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: scripts/check-*.sh
        run: |
          status=0
          for script in scripts/check-*.sh; do
            [ -e "$script" ] || continue
            echo "::group::$script"
            "$script" || { status=1; echo "::error::$script failed"; }
            echo "::endgroup::"
          done
          exit "$status"
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  lint:
    defaults:
      run:
        shell: bash scripts/ci/logged.sh {0}
    name: Lint workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install linters (pinned, SHA-256 verified)
        run: scripts/ci/install-tool.sh actionlint zizmor shellcheck
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/ci/*.sh scripts/lib/*.sh
      - name: actionlint
        run: actionlint
      # Online audits (impostor commits, known-vulnerable actions, stale
      # pins) use the job's read-only token.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .
      # The failure's output as annotations, readable without signing in
      # (.github/actions/annotate-failure).
      - name: Publish the failure's log tail
        if: failure()
        uses: ./.github/actions/annotate-failure

  result:
    name: CI result
    if: always()
    needs: [plan, fmt, clippy, test, ci-test-keys, containers, packaging, msrv, docs, deny, fips, fuzz-replay, checks, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Only the jobs the plan gates (no crates yet, no `fips` feature yet)
      # may be skipped; every other job must succeed.
      - name: Every job passed, or was skipped by the plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '["clippy", "test", "ci-test-keys", "containers", "packaging", "msrv", "docs", "fips"] as $gated
            | to_entries
            | all(.value.result == "success"
                  or (.value.result == "skipped" and (.key | IN($gated[]))))' <<<"$NEEDS" >/dev/null \
            || { echo "::error::a CI job failed, was cancelled, or was skipped unexpectedly"; exit 1; }
