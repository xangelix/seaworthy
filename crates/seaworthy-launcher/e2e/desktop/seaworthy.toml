# The desktop fixture: a client-only desktop product — the e2e launcher
# fixture (`demo`) and its per-CPU cores (`demo_core`), data files beside
# them, icons, a menu entry and shortcuts, a document type of its own, an
# MSI for either scope with a licence page, no update helper and so no
# release manifests. The packaging lanes build, package and install it as a
# product's pipeline does: Linux packages, the Windows MSI and zip, and on
# Apple Silicon an ad hoc-signed app in a disk image. Paths are relative to
# this file; the crate paths to the e2e workspace. (`demo/build.rs` links
# `icons/viewer.ico` into the Windows launcher.)
#
# Beside it, the lab's upgrade-from-previous fixture (scripts/
# upgrade-candidate.sh, docs/testing.md): the same launcher and cores as a
# service with the update helper (`demo_helper`), for Linux (`agent`) and
# for macOS (`daemon`; launchd has no per-service accounts, so its service
# runs as root and has its own product). Each lab build writes its version
# token into `lab/build.txt` (a copy of this directory), so an upgrade
# shows in the installed files. Its builds are non-release builds signed
# with the CI test key (`--ci-test-signing`), which the lab's helper is
# built to trust as a CI test key (`[defaults.ci-test-keys]` below,
# `ci_test_keys!` under SEAWORTHY_ALLOW_CI_TEST_KEYS=1, beside the release
# key): `keys/ci-test.key` is a PUBLIC test key, committed on
# purpose so that every run, and the next run's previous build, signs
# with it. Anyone can sign with it, so nothing but this fixture may ever
# trust it (docs/threat-model.md, the CI test-key mechanism).
# `keys/release.pub` is the fixture's release key, whose secret was
# discarded when it was made: nothing is ever released from here.

[defaults]
vendor = "Acme"
targets = ["x86-64-v4", "x86-64-v3", "x86-64-v2"]
macos-targets = ["apple-m4", "apple-m1"]
channel = "stable"
maintainer = "Acme Packaging <packages@example.com>"
license = "MIT OR Apache-2.0"
homepage = "https://example.com/acme/viewer"
release-signatures = ["ml-dsa-87"]
release-keys = [{ algorithm = "ml-dsa-87", public-key = "keys/release.pub" }]

[defaults.ci-test-keys]
release-keys = [{ algorithm = "ml-dsa-87", public-key = "keys/ci-test.pub" }]

[product.viewer]
display-name = "Acme Viewer"
description = "The desktop fixture: the launcher, its cores, data files, icons and shortcuts."
launcher = "demo"
executable = "demo"
core = "demo_core"
kind = "desktop"
windows-directory = "Viewer"
outputs = ["msi", "zip", "deb", "tar", "dmg"]
updates.default = "off"
linux.command = "acme-viewer"
linux.depends.deb = ["libc6 (>= 2.34)"]

[product.viewer.desktop]
linux-icons = ["icons/viewer-48.png", "icons/viewer.svg"]
windows-icon = "icons/viewer.ico"
desktop-shortcut = true
categories = ["Utility"]

[product.viewer.macos]
bundle-id = "com.example.acme.viewer"
icon = "icons/viewer.icns"
category = "public.app-category.utilities"

[[product.viewer.files]]
source = "data"
destination = "share"

# The MSI installs for the current user by default, or for everyone on
# request (the setup dialog's choice, or ALLUSERS=1 MSIINSTALLPERUSER="" on
# the command line), shows a licence to accept in an interactive install,
# and keeps Windows Error Reporting away from the launcher.
[product.viewer.msi]
install-scope = "either"
license = "license.rtf"
wer-exclude = ["demo"]

# Its own document type, registered on every platform it installs on: a
# shared-mime-info definition (globs and magic), document icons and the
# menu entry's MimeType on Linux, with a KDE service menu for the second
# verb; the ProgID, its verbs and the extension under the install scope's
# Classes on Windows; the bundle's document type and exported UTI on macOS.
# (The fixture's own icons, reused as document icons.)
[[product.viewer.file-types]]
name = "Acme Viewer document"
extensions = ["acmeview"]
mime-type = "application/x-acme-viewer-doc"
magic = [{ offset = 0, string = "ACMEVIEW" }]
linux-icons = ["icons/viewer-48.png", "icons/viewer.svg"]
windows-icon = "icons/viewer.ico"
macos-icon = "icons/viewer.icns"
progid = "Acme.ViewerDocument"
uti = { identifier = "com.example.acme.viewer-document", conforms-to = ["public.data"] }
verbs = [
    { id = "open", label = "Open", default = true, arguments = ["--", "{path}"] },
    { id = "inspect", label = "Inspect", arguments = ["--inspect", "--", "{path}"] },
]

# The same launcher and cores as a command-line tool, in the several-programs
# form, that can't be installed beside the viewer: the self-test builds,
# packages and adopts both MSIs, each searching for the other's UpgradeCode
# (detect-only), and both debs conflict with each other.
[product.viewer-lite]
display-name = "Acme Viewer Lite"
description = "The desktop fixture's launcher and cores as a command-line tool beside which the viewer can't be installed."
kind = "tool"
windows-directory = "ViewerLite"
outputs = ["msi", "deb"]
updates.default = "off"
conflicts = ["viewer"]
linux.provides = ["acme-viewer-cli"]
linux.depends.deb = ["libc6 (>= 2.34)"]

[[product.viewer-lite.programs]]
executable = "demo"
launcher = "demo"
core = "demo_core"
role = "cli"
command = "acme-viewer-lite"

# Its install directory on PATH: the user's for a per-user install (the
# default), the system's for one for everyone.
[product.viewer-lite.msi]
install-scope = "either"
path = true

# The lab's service fixture on Linux: deb, rpm and pacman packages, the
# service under its own account, and the update helper, which takes its
# version from the lab's required-version endpoint.
[product.agent]
display-name = "Acme Agent"
description = "The lab's service fixture: the launcher and its cores as a service, with the update helper."
executable = "demo"
core = "demo_core"
helper = "demo_helper"
outputs = ["deb", "rpm", "pacman"]
updates.default = "auto"
linux.depends.deb = ["libc6 (>= 2.34)"]
linux.depends.rpm = ["glibc >= 2.34"]
linux.depends.pacman = ["glibc"]

[product.agent.service]
name = "AcmeAgent"
account = "virtual"
arguments = ["serve"]
restart-delays = ["15s", "60s"]
state-directory = "acme/agent"

[product.agent.service.sandbox]
user = "acme-agent"

[[product.agent.files]]
source = "lab"
destination = "lab"

# The lab's service fixture on macOS: a pkg whose LaunchDaemon runs the
# service as root, and the helper's daemon.
[product.daemon]
display-name = "Acme Daemon"
description = "The lab's service fixture on macOS: the launcher and its cores as a LaunchDaemon, with the update helper."
executable = "demo"
core = "demo_core"
helper = "demo_helper"
outputs = ["pkg"]
updates.default = "auto"

[product.daemon.service]
name = "AcmeDaemon"
account = "local-system"
arguments = ["serve"]
restart-delays = ["15s"]
state-directory = "acme/daemon"

# A macOS service runs as root, said explicitly (its package creates no
# daemon account yet).
[product.daemon.service.macos]
account = "root"

[product.daemon.macos]
bundle-id = "com.example.acme.daemon"

[[product.daemon.files]]
source = "lab"
destination = "lab"
