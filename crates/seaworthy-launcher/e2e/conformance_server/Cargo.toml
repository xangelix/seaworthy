[package]
name = "conformance_server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The lab server as the conformance lanes run it inside each systemd host
# (scripts/linux-conformance.sh, the seaworthy CLI's conformance suite,
# the upgrade lanes): `seaworthy-lab serve`'s options without the
# subcommand, built in the lane's builder image beside the product, whose
# glibc every distribution of the lane runs. Never packaged.

[dependencies]
seaworthy-lab = { path = "../../../seaworthy-lab", default-features = false, features = ["server"] }
