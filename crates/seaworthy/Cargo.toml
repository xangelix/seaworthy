[package]
name = "seaworthy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The seaworthy packaging tool: verifies built launchers and per-CPU cores against a seaworthy.toml, lays out install trees, builds reproducible deb, rpm and pacman packages, tarballs, zips, MSIs, macOS bundles and Group Policy templates, signs release manifests and publishes signed repositories. It never compiles product code."
readme = "README.md"
keywords = ["packaging", "msi", "deb", "rpm", "release"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[lib]
name = "seaworthy"
path = "src/lib.rs"

[[bin]]
name = "seaworthy"
path = "src/main.rs"

[features]
default = []
# The S3 publish client (`seaworthy::s3`): SigV4 over seaworthy-crypto, the
# bounded management calls a publication needs (create-only puts, head,
# get, list, delete), reqwest on the crypto crate's TLS configuration.
publish-s3 = [
    "dep:base64",
    "dep:bytes",
    "dep:futures-util",
    "dep:quick-xml",
    "dep:reqwest",
    "dep:rustls-platform-verifier",
    "dep:tokio",
]

# A build-host tool: native only.
[dependencies]
# The records each core and launcher carries, and the feature table.
seaworthy-levels.workspace = true
# The pure service renderers: a seaworthy.toml service is validated (and
# later rendered) by the same rules an install uses.
seaworthy-service.workspace = true
# SHA-256 for sidecar identity and the layout manifest; the pinned FIPS
# module's symbol prefix; the release keys' signing operations; and, for
# the S3 client, HMAC-SHA-256 and SHA-256 for SigV4, the checksums,
# constant-time compares and the TLS client builder.
seaworthy-crypto.workspace = true
# The release manifest's own encoder and key intake (seaworthy-formats,
# re-exported), the bounded process runner and the OpenPGP checks: the
# release side and the update helper can never disagree on the format.
seaworthy-updater.workspace = true
# Key files and command signers' output are hex.
hex.workspace = true
# Secret key material is wiped on drop.
zeroize.workspace = true
# ELF symbol tables and DT_NEEDED, PE imports. Read-side features only.
object = { workspace = true, features = ["read_core", "elf", "pe", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# seaworthy.toml.
toml.workspace = true
# The repository URLs machines fetch through, checked as a URL parser reads
# them (config.rs).
url.workspace = true
# The reproducible archives (src/archive.rs): zstd for the Linux tarball,
# raw deflate for the Windows zip.
zstd.workspace = true
miniz_oxide.workspace = true

# The release-ordering lint (src/ci_order.rs) reads a product's GitLab CI:
# a pure-Rust YAML 1.2 parser (the maintained fork of yaml-rust), without
# the optional encoding_rs (CI files are UTF-8).
yaml-rust2.workspace = true

# publish-s3: the `x-amz-checksum-sha256` wire encoding.
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# publish-s3: `StreamExt` over response bodies and the boxed object stream.
futures-util = { workspace = true, optional = true, features = ["std"] }
# publish-s3: the one XML parser: S3 keys and ETags carry XML entities, and
# entity handling is exactly the part a hand parser gets wrong.
quick-xml = { workspace = true, optional = true }
# publish-s3: rustls with NO provider of its own: every client is built with
# `use_preconfigured_tls` on `seaworthy_crypto::tls::client_config_builder()`
# (scripts/check-tls-construction.sh). `stream` for response bodies.
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "stream"] }
# publish-s3: the operating system's trust store, attached to the crypto
# crate's client builder (an allowlisted site in
# scripts/tls-construction-allowlist.txt).
rustls-platform-verifier = { workspace = true, optional = true }
# publish-s3: the deadlines (`time`) every request runs under.
tokio = { workspace = true, optional = true, features = ["time"] }

# Signing programs run in their own process group; on a deadline the whole
# group is killed (src/process.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true
# An imported OpenPGP key's private home is removed on SIGTERM, SIGINT and
# SIGHUP too (src/codesign.rs, ImportedGpg).
signal-hook.workspace = true

[dev-dependencies]
base64.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["std"] }
hex.workspace = true
seaworthy-crypto.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize.workspace = true

# The container harness is unix-only; the RustFS suite is gated to match.
[target.'cfg(unix)'.dev-dependencies]
seaworthy-test-support.workspace = true

[[test]]
name = "sigv4_vectors"
required-features = ["publish-s3"]

[[test]]
name = "s3_stub"
required-features = ["publish-s3"]

[[test]]
name = "s3_direct_stub"
required-features = ["publish-s3"]

[[test]]
name = "s3_rustfs"
required-features = ["publish-s3"]

[lints]
workspace = true
