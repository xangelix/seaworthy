# A specific stable release, never the floating `stable` channel: a new
# release is a reviewed change (new lints, rustdoc rules, codegen), not one
# that lands mid-change. Bump deliberately in one commit, together with
# `workspace.package.rust-version` when the MSRV moves (CONTRIBUTING.md).
# The fuzz crate pins its own nightly (fuzz/README.md).
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
